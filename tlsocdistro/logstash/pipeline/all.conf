## TLSOC — Logstash: FOSS SOC Engine output → OpenSearch
## The engine writes ECS-normalized JSON (one file per source) into /parser_output; Logstash tails
## them and ships to OpenSearch. Index name is `fosstlsoc-logs-*` so the TLSOC Overview cockpit
## (default pattern fosstlsoc-logs-*,all-logs-*,soc-*) picks it up automatically.

input {
  file {
    # Glob every engine output file — no need to list them one by one.
    path => ["/parser_output/*.json"]
    start_position => "end"                              # new deploy: start at end-of-file (no replay)
    sincedb_path => "/usr/share/logstash/data/sincedb"
    codec => json
    mode => "tail"
  }
}

filter {
  # Carry a friendly host.name from the envelope when the engine set it, and compute a
  # per-endpoint index slug in @metadata (NEVER a real event field — @metadata is dropped before
  # output, so it never gets indexed or costs a mapping).
  if [observer][server] {
    mutate { replace => { "[host][name]" => "%{[observer][server]}" } }
    mutate { add_field => { "[@metadata][server_slug]" => "%{[observer][server]}" } }
  } else if [observer][source_host] {
    mutate { replace => { "[host][name]" => "%{[observer][source_host]}" } }
    mutate { add_field => { "[@metadata][server_slug]" => "%{[observer][source_host]}" } }
  } else {
    # Guarantees the slug is always present, so the output index name below never contains a
    # literal, unexpanded "%{...}" (Logstash's missing-field-in-index-name trap).
    mutate { add_field => { "[@metadata][server_slug]" => "unknown" } }
  }
  # Sanitize the slug for safe use in an index name. Two sequential mutate blocks (lowercase
  # first, then gsub) so the ordering is explicit rather than relying on how a single mutate
  # invocation orders its internal operations.
  mutate { lowercase => [ "[@metadata][server_slug]" ] }
  mutate { gsub => [ "[@metadata][server_slug]", "[^a-z0-9_.-]", "-" ] }
}

output {
  opensearch {
    hosts    => ["https://opensearch:9200"]
    user     => "admin"
    password => "${OPENSEARCH_ADMIN_PASSWORD}"
    ssl      => true
    # DEMO certs → skip verification. For production: set to true and provide `cacert => "..."`.
    ssl_certificate_verification => false
    # Per-endpoint daily index (server_slug is always set, see filter above). The
    # fosstlsoc-logs-* index-template pattern already covers every slug; no template change needed.
    index    => "fosstlsoc-logs-%{[@metadata][server_slug]}-%{+YYYY.MM.dd}"
  }
  # Uncomment to also echo parsed events to the Logstash log while testing:
  # stdout { codec => rubydebug }
}
