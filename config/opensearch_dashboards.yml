# Set the value to true to enable workspace feature
# Please note, workspace will not work with multi-tenancy. To enable workspace feature, you need to disable multi-tenancy first with `opensearch_security.multitenancy.enabled: false`
# ============ TLSOC Phase 5b — Task 5b.2 (decision D-014) ============
# Workspace IS the TLSOC tenancy mechanism: 1 workspace = 1 organization; per-tenant saved-object
# scoping rides the /w/{workspaceId}/ URL prefix (WorkspaceIdConsumerWrapper). This REQUIRES
# opensearch_security.multitenancy.enabled: false, which is set explicitly (with its own load-bearing
# warning) in the TLSOC security block later in this file — never enable multitenancy alongside this.
workspace.enabled: true

