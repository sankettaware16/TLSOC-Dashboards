# TLSOC branding. The logo, mark, and favicon now come from the BUILT-IN TLSOC DEFAULTS
# (src/core/common/logos/get_logos.ts → ui/logos/tlsoc_*.svg, and the regenerated core_app/assets/favicons/*).
# Those defaults are basePath-prepended, so they render under ANY basePath with NO custom URLs here and NO
# --no-base-path dev flag. Only applicationTitle + useExpandedHeader remain (no asset URLs needed).
# The placeholder tlsoc_*.svg assets get swapped for the official IITB Trust Lab asset at the same paths later.
opensearchDashboards.branding:
  applicationTitle: "TLSOC"
  useExpandedHeader: false

