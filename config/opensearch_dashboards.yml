# === TLSOC Phase 0 — batch 2: visualization/charts cluster (disable, not delete) ===
# Reversible runtime disable of non-security visualization apps. EXCLUDED (must stay enabled):
# charts, visualizations, visDefaultEditor, visAugmenter (Discover/Explore depend on them via
# requiredPlugins/requiredBundles), and maps_legacy/region_map/tile_map (strict schema rejects the
# `enabled` key -> would crash boot; needs a schema edit first, deferred). Source retained throughout.
# --- TEMPORARILY RE-ENABLED FOR DATA/VIZ TESTING (2026-06-22) ---
# These 12 viz plugins were disabled in Phase 0. They are re-enabled (by commenting the disable lines)
# ONLY so the sample-data dashboards + visualizations render and we can see how Discover/Visualize/Dashboards
# work against real data. To restore the Phase-0 strip-down, simply UNCOMMENT the 12 lines below.
# vis_type_markdown.enabled: false
# vis_type_metric.enabled: false
# vis_type_table.enabled: false
# vis_type_tagcloud.enabled: false
# vis_type_timeline.enabled: false
# vis_type_timeseries.enabled: false
# vis_type_vega.enabled: false
# vis_type_vislib.enabled: false
# vis_type_xy.enabled: false
# visualize.enabled: false
# vis_builder.enabled: false
# input_control_vis.enabled: false

# === TLSOC Phase 0 — batch 3: remaining non-security modules (disable, not delete) ===
# Reversible runtime disable. EXCLUDED: usage_collection (Discover/Explore/data hard-require it).
# Already inert (manifest renamed/absent, not discovered): telemetry*, newsfeed. agent_traces is left
# untouched on purpose (already cascade-off via explore; keep the door open for SOC trace investigation).
opensearch_dashboards_overview.enabled: false
opensearch_dashboards_usage_collection.enabled: false
legacy_export.enabled: false

# === TLSOC Phase 1 — force dark mode (analyst-primary experience; reversible) ===
# Locks theme:darkMode on so the v8.dark bundle (our recolored TLSOC theme) loads. Uses
# uiSettings.overrides (schema.object unknowns:'allow', ui_settings_config.ts:59) — a lock, not a default.
# TLSOC theme policy (2026-06-22): DEFAULT = LIGHT, manually switchable to dark, NO forced lock.
# An earlier uiSettings.overrides entry forced theme:darkMode=on; it was intentionally removed so dark mode
# now defaults to OFF (light) and is toggleable in Advanced Settings. NOTE: only theme:version "Next" (v8) is
# TLSOC-recolored — v7 and v9 are untouched OUI defaults.
# To FORCE dark again, restore:                 uiSettings.overrides: { "theme:darkMode": true }
# To let each user pick from the top-nav menu:  theme:enableUserControl: true

# === TLSOC Phase 2 — Task 2.1: enable the modern nav-group navigation engine (decision D-006) ===
# The SOC tree (Overview/Alerts/Investigations/Cases/Detections/Threat Intel/Assets/Dashboards/Administration)
# is built on OSD's nav-GROUP engine (CollapsibleNavGroupEnabled flyout), NOT the legacy category nav. That
# engine is gated by the uiSetting `home:useNewHomePage` (default false; header.tsx:727 picks the renderer).
# This is a REVERSIBLE probe via uiSettings.overrides (schema.object unknowns:'allow', ui_settings_config.ts:59 —
# a lock, not a default). Once verified, a later task converts this to the source default in
# src/plugins/home/server/ui_settings.ts so it's baked into the product (staged like Phase 0 disable->verify).
# NOTE: this flag is a two-for-one — it also switches the top header bar to the updated variant (useUpdatedHeader).
uiSettings.overrides:
  "home:useNewHomePage": true

# === TLSOC Phase 5 — Task 5a.1b: authentication via the OpenSearch Security stack (decision D-013) ===
# The engine (container tlsoc-opensearch, named volume tlsoc-osdata) now runs with security ENABLED (demo config:
# self-signed TLS certs + internal users). OSD connects over HTTPS as the `kibanaserver` SERVICE ACCOUNT (demo
# default password — HARDEN AT PHASE 6 along with real certs and the dev admin password). End users authenticate
# through the vendored security-dashboards-plugin (plugins/security-dashboards-plugin — a FROZEN TLSOC-owned
# snapshot, see its TLSOC-VENDOR.md; decision D-013).
opensearch.hosts: ["https://localhost:9200"]
opensearch.username: "kibanaserver"
opensearch.password: "kibanaserver"
# Demo certs are self-signed → no verification in dev. Phase 6 (packaging) replaces demo certs and sets 'full'.
opensearch.ssl.verificationMode: none
# Forward the caller's credentials to the engine so asCurrentUser acts as the logged-in user (5a identity seam).
opensearch.requestHeadersAllowlist: ["authorization", "securitytenant"]

# ⚠️ LOAD-BEARING — DO NOT ENABLE MULTITENANCY. Written explicitly (not left to default) on purpose:
# OS-Security multitenancy swaps saved-object indices per tenant and is INCOMPATIBLE with the OSD `workspace`
# machinery (see the workspace note earlier in this file) — enabling it would silently FORECLOSE the Phase-5b
# workspace-based tenancy option (the current front-runner, decision D-014 pending). With multitenancy false the
# plugin never touches saved objects (verified from plugin source, journal "TASK 5a.1-PREFLIGHT" Q3).
opensearch_security.multitenancy.enabled: false

# Session cookie (encryption key must be 32+ chars; dev value — rotate at Phase 6).
opensearch_security.cookie.password: "tlsoc-dev-cookie-encryption-key-2026-change-at-packaging"
opensearch_security.cookie.secure: false

# TLSOC login-page copy (the mark/wordmark already come from the Phase-1 branding config).
opensearch_security.ui.basicauth.login.title: "Log in to TLSOC"
opensearch_security.ui.basicauth.login.subtitle: "IITB Trust Lab Security Operations Center. If you have forgotten your username or password, contact your SOC administrator."
